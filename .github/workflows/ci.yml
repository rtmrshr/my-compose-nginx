name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test-nginx-compose:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Show docker and compose versions
      run: |
        docker --version
        docker compose version

    - name: Start Nginx via docker compose
      run: docker compose up -d

    - name: Wait for Nginx to start
      run: sleep 5

    - name: Test that Nginx is running
      run: curl -I http://localhost:8080

    - name: Stop Nginx
      run: docker compose down
